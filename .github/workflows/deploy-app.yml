name: Deploy App to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  EMSDK_VERSION: latest

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Install JavaScript tools
        run: |
          npm ci
          npm install --global typescript

      - name: Cache Emscripten build cache
        uses: actions/cache@v4
        with:
          path: build/emscripten/em-cache
          key: ${{ runner.os }}-emcache-${{ env.EMSDK_VERSION }}

      - name: Install Emscripten SDK
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git .emsdk
          ./.emsdk/emsdk install "$EMSDK_VERSION"
          ./.emsdk/emsdk activate "$EMSDK_VERSION"
          echo "$PWD/.emsdk" >> "$GITHUB_PATH"
          echo "$PWD/.emsdk/upstream/emscripten" >> "$GITHUB_PATH"
          echo "EMSDK=$PWD/.emsdk" >> "$GITHUB_ENV"
          echo "EM_CONFIG=$HOME/.emscripten" >> "$GITHUB_ENV"

      - name: Build browser app
        run: |
          source .emsdk/emsdk_env.sh
          emcc --version
          ninja --version
          tsc --version
          ninja -f build.ninja browser

      - name: Prepare Pages artifact
        run: |
          rm -rf _site
          mkdir -p _site
          cp browser/app/app.html _site/index.html
          cp browser/app/app.html _site/app.html
          cp build/browser/tcltk.html _site/tcltk.html
          cp build/browser/tcltk.js _site/tcltk.js
          cp build/browser/tcltk.wasm _site/tcltk.wasm
          cp build/browser/tcltk.data _site/tcltk.data
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
