<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tcl/Tk WASM</title>
  <style>
    html,
    body {
      margin: 0;
      min-height: 100%;
      font: 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f6f7;
      color: #1f2328;
    }

    body {
      display: grid;
      grid-template-rows: auto 1fr;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 42px;
      padding: 0 14px;
      border-bottom: 1px solid #d8dee4;
      background: #ffffff;
    }

    main {
      min-height: 0;
      padding: 16px;
    }

    #tk-browser-root {
      width: min(100%, 1024px);
      height: min(768px, calc(100vh - 78px));
      border: 1px solid #d0d7de;
      background: #ffffff;
    }

    #tk-browser-status {
      color: #57606a;
      font-size: 12px;
    }

    #tk-browser-result-panel {
      margin-top: 12px;
      max-width: 1024px;
    }

    #tk-browser-result-panel > span {
      display: block;
      margin-bottom: 4px;
      color: #57606a;
      font-size: 12px;
    }

    #tk-browser-result {
      min-height: 20px;
      margin: 0;
      padding: 8px;
      overflow: auto;
      border: 1px solid #d0d7de;
      background: #ffffff;
      color: #1f2328;
      font: 12px ui-monospace, SFMono-Regular, "SF Mono", Consolas, monospace;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <header>
    <strong>Tcl/Tk WASM</strong>
    <span id="tk-browser-status">loading</span>
  </header>
  <main>
    <div id="tk-browser-root"></div>
    <section id="tk-browser-result-panel" aria-label="Tcl result">
      <span>Result</span>
      <pre id="tk-browser-result" data-code=""></pre>
    </section>
  </main>
  <script>
    (function installTextDecoderResizableArrayBufferWorkaround() {
      "use strict";

      const NativeTextDecoder = globalThis.TextDecoder;
      if (typeof NativeTextDecoder !== "function") {
        return;
      }

      function copyBufferSource(input) {
        if (ArrayBuffer.isView(input)) {
          return Uint8Array.from(new Uint8Array(
            input.buffer,
            input.byteOffset,
            input.byteLength
          ));
        }
        if (input instanceof ArrayBuffer) {
          return input.slice(0);
        }
        return input;
      }

      globalThis.TextDecoder = class TextDecoder extends NativeTextDecoder {
        decode(input, options) {
          try {
            return super.decode(input, options);
          } catch (error) {
            if (!/resizable/i.test(String(error && error.message))) {
              throw error;
            }
            return super.decode(copyBufferSource(input), options);
          }
        }
      };
    })();
  </script>
  <script>
    function tkBrowserArgumentsFromLocation() {
      const params = new URLSearchParams(window.location.search);
      return [
        ...params.getAll("argv"),
        ...params.getAll("arg")
      ];
    }

    function tkBrowserEvalScriptsFromLocation() {
      const params = new URLSearchParams(window.location.search);
      return params.getAll("eval");
    }

    var Module = globalThis.Module || {};
    if (!Object.prototype.hasOwnProperty.call(Module, "x11WasmRoot")) {
      Module.x11WasmRoot = "#tk-browser-root";
    }
    if (!Object.prototype.hasOwnProperty.call(Module, "arguments")) {
      Module.arguments = tkBrowserArgumentsFromLocation();
    }
    if (!Object.prototype.hasOwnProperty.call(Module, "tkBrowserEvalScripts")) {
      Module.tkBrowserEvalScripts = tkBrowserEvalScriptsFromLocation();
    }
    if (!Object.prototype.hasOwnProperty.call(Module, "print")) {
      Module.print = function(text) {
        console.log(text);
      };
    }
    if (!Object.prototype.hasOwnProperty.call(Module, "printErr")) {
      Module.printErr = function(text) {
        console.error(text);
      };
    }
    globalThis.Module = Module;
  </script>
  {{{ SCRIPT }}}
</body>
</html>
