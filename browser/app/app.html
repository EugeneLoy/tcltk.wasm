<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tcl/Tk WASM App</title>
  <style>
    :root {
      color-scheme: light;
      font: 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #1f2328;
      background: #f5f6f7;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      grid-template-rows: 44px minmax(0, 1fr);
      min-height: 100vh;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 16px;
      border-bottom: 1px solid #d0d7de;
      background: #ffffff;
    }

    header strong {
      font-size: 14px;
      font-weight: 650;
    }

    #tk-browser-status {
      min-width: 92px;
      color: #57606a;
      font-size: 12px;
      text-align: right;
    }

    main {
      display: grid;
      grid-template-columns: minmax(320px, 420px) minmax(520px, 1fr);
      gap: 12px;
      min-height: 0;
      padding: 12px;
    }

    section {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      min-width: 0;
      min-height: 0;
      border: 1px solid #d0d7de;
      border-radius: 8px;
      background: #ffffff;
    }

    .panel-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 38px;
      padding: 0 12px;
      border-bottom: 1px solid #d8dee4;
      color: #24292f;
      font-size: 13px;
      font-weight: 650;
    }

    .shell-body {
      display: grid;
      grid-template-rows: minmax(180px, 1fr) auto auto;
      min-height: 0;
    }

    #tcl-shell-output {
      min-height: 0;
      margin: 0;
      padding: 12px;
      overflow: auto;
      border: 0;
      background: #0f1720;
      color: #d8dee9;
      font: 13px ui-monospace, SFMono-Regular, "SF Mono", Consolas, monospace;
      line-height: 1.45;
      white-space: pre-wrap;
    }

    .command-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 8px;
      padding: 10px;
      border-top: 1px solid #d8dee4;
      background: #f6f8fa;
    }

    #tcl-command {
      width: 100%;
      min-height: 112px;
      resize: vertical;
      padding: 9px 10px;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      color: #1f2328;
      background: #ffffff;
      font: 13px ui-monospace, SFMono-Regular, "SF Mono", Consolas, monospace;
      line-height: 1.45;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    button {
      min-height: 32px;
      padding: 0 11px;
      border: 1px solid #afb8c1;
      border-radius: 6px;
      color: #24292f;
      background: #f6f8fa;
      font: inherit;
      cursor: pointer;
    }

    button.primary {
      border-color: #1f6feb;
      color: #ffffff;
      background: #0969da;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .result-panel {
      min-height: 84px;
      border-top: 1px solid #d8dee4;
      background: #ffffff;
    }

    .result-panel span {
      display: block;
      padding: 7px 10px 0;
      color: #57606a;
      font-size: 12px;
    }

    #tk-browser-result {
      min-height: 50px;
      max-height: 160px;
      margin: 0;
      padding: 7px 10px 10px;
      overflow: auto;
      color: #1f2328;
      font: 13px ui-monospace, SFMono-Regular, "SF Mono", Consolas, monospace;
      white-space: pre-wrap;
    }

    .window-body {
      position: relative;
      min-height: 0;
      padding: 10px;
      background: #f6f8fa;
    }

    #tk-browser-root {
      width: 100%;
      height: 100%;
      min-height: 560px;
      overflow: hidden;
      border: 1px solid #d0d7de;
      background: #ffffff;
    }

    @media (max-width: 920px) {
      body {
        grid-template-rows: 44px auto;
      }

      main {
        grid-template-columns: 1fr;
      }

      #tk-browser-root {
        min-height: 480px;
      }
    }
  </style>
</head>
<body>
  <header>
    <strong>Tcl/Tk WASM</strong>
    <span id="tk-browser-status">loading</span>
  </header>
  <main>
    <section aria-label="Tcl Shell">
      <div class="panel-title">Tcl Shell</div>
      <div class="shell-body">
        <pre id="tcl-shell-output"></pre>
        <div class="command-row">
          <textarea id="tcl-command" spellcheck="false" autocomplete="off">winfo children .
wm title . {User Window}
button .again -text {Created from shell} -command {browser::setResult {button clicked}}
pack .again -padx 12 -pady 8
update
list ok [winfo children .]</textarea>
          <div class="button-row">
            <button id="tcl-run" class="primary" type="button" disabled>Run</button>
            <button id="tcl-demo" type="button" disabled>Demo</button>
            <button id="tcl-clear" type="button">Clear</button>
          </div>
        </div>
        <div class="result-panel" aria-label="Last Tcl result">
          <span>Last Result</span>
          <pre id="tk-browser-result" data-code=""></pre>
        </div>
      </div>
    </section>
    <section aria-label="User Window">
      <div class="panel-title">User Window</div>
      <div class="window-body">
        <div id="tk-browser-root"></div>
      </div>
    </section>
  </main>
  <script>
    (function installTextDecoderResizableArrayBufferWorkaround() {
      "use strict";

      const NativeTextDecoder = globalThis.TextDecoder;
      if (typeof NativeTextDecoder !== "function") {
        return;
      }

      function copyBufferSource(input) {
        if (ArrayBuffer.isView(input)) {
          return Uint8Array.from(new Uint8Array(
            input.buffer,
            input.byteOffset,
            input.byteLength
          ));
        }
        if (input instanceof ArrayBuffer) {
          return input.slice(0);
        }
        return input;
      }

      globalThis.TextDecoder = class TextDecoder extends NativeTextDecoder {
        decode(input, options) {
          try {
            return super.decode(input, options);
          } catch (error) {
            if (!/resizable/i.test(String(error && error.message))) {
              throw error;
            }
            return super.decode(copyBufferSource(input), options);
          }
        }
      };
    })();
  </script>
  <script>
    (function configureTclTkApp() {
      "use strict";

      const encoder = new TextEncoder();
      const statusElement = document.getElementById("tk-browser-status");
      const resultElement = document.getElementById("tk-browser-result");
      const outputElement = document.getElementById("tcl-shell-output");
      const commandElement = document.getElementById("tcl-command");
      const runButton = document.getElementById("tcl-run");
      const demoButton = document.getElementById("tcl-demo");
      const clearButton = document.getElementById("tcl-clear");
      let runtimeReady = false;
      let evaluationPending = false;
      let history = [];
      let historyIndex = 0;

      function setStatus(text) {
        if (statusElement) {
          statusElement.textContent = text;
        }
      }

      function appendOutput(prefix, text) {
        if (!outputElement) {
          return;
        }
        const value = String(text || "");
        outputElement.textContent += `${prefix}${value}\n`;
        outputElement.scrollTop = outputElement.scrollHeight;
      }

      function setShellEnabled(enabled) {
        runtimeReady = enabled;
        if (runButton) {
          runButton.disabled = !enabled || evaluationPending;
        }
        if (demoButton) {
          demoButton.disabled = !enabled || evaluationPending;
        }
      }

      function initialTkScript() {
        return [
          "wm title . {User Window - IME Sample}",
          "catch {destroy .root}",
          "namespace eval ::imeSample {}",
          "proc ::imeSample::value {widget} {",
          "    if {![winfo exists $widget]} {return {}}",
          "    if {[winfo class $widget] eq {Text}} {return [$widget get 1.0 {end-1c}]}",
          "    if {[catch {$widget get} value]} {return {}}",
          "    return $value",
          "}",
          "proc ::imeSample::cursor {widget} {",
          "    if {![winfo exists $widget]} {return {}}",
          "    if {[winfo class $widget] eq {Text}} {return [$widget index insert]}",
          "    if {[catch {$widget index insert} cursor]} {return {}}",
          "    return $cursor",
          "}",
          "proc ::imeSample::record {event widget detail} {",
          "    set value [::imeSample::value $widget]",
          "    set cursor [::imeSample::cursor $widget]",
          "    set summary [list $event $widget cursor $cursor detail $detail value $value]",
          "    if {[winfo exists .root.status.value]} {.root.status.value configure -text $summary}",
          "    browser::setResult $summary",
          "}",
          "proc ::imeSample::report {} {",
          "    set values [list entry [.root.form.entry get] initial [.root.form.initial get] text [.root.form.text get 1.0 {end-1c}] spinbox [.root.form.spin get] password [.root.form.password get]]",
          "    browser::setResult $values",
          "    if {[winfo exists .root.status.value]} {.root.status.value configure -text $values}",
          "}",
          "proc ::imeSample::clear {} {",
          "    foreach widget {.root.form.entry .root.form.initial .root.form.password} {$widget delete 0 end}",
          "    .root.form.text delete 1.0 end",
          "    .root.form.spin delete 0 end",
          "    browser::setResult {cleared}",
          "}",
          "proc ::imeSample::shortcutSummary {source action widget} {",
          "    set values [list entry [.root.form.entry get] initial [.root.form.initial get] text [.root.form.text get 1.0 {end-1c}] spinbox [.root.form.spin get] password [.root.form.password get]]",
          "    return [list shortcut $source $action widget $widget focus [focus] values $values]",
          "}",
          "proc ::imeSample::recordShortcut {source action widget} {",
          "    set summary [::imeSample::shortcutSummary $source $action $widget]",
          "    if {[winfo exists .root.status.value]} {.root.status.value configure -text $summary}",
          "    browser::setResult $summary",
          "}",
          "proc ::imeSample::installShortcutObservers {} {",
          "    foreach event {<<Cut>> <<Copy>> <<Paste>> <<Undo>> <<Redo>> <<SelectAll>>} {",
          "        bind all $event [list after idle [list ::imeSample::recordShortcut standard $event %W]]",
          "    }",
          "    foreach sequence {<Control-Shift-Key-S> <Meta-Shift-Key-S>} {",
          "        bind all $sequence {::imeSample::recordShortcut script save %W; break}",
          "    }",
          "    foreach sequence {<Control-Shift-Key-R> <Meta-Shift-Key-R>} {",
          "        bind all $sequence {::imeSample::report; ::imeSample::recordShortcut script report %W; break}",
          "    }",
          "}",
          "proc ::imeSample::complexFont {} {",
          "    if {![info exists ::imeSample::fontName]} {set ::imeSample::fontName [font create -family Helvetica -size 22]}",
          "    return $::imeSample::fontName",
          "}",
          "proc ::imeSample::complexCases {} {",
          "    return [list [list {flag+latin} {🇯🇵x} [list {🇯🇵} {x}]] [list {combining acute} {éx} [list {é} {x}]] [list {emoji zwj} {👩‍💻!} [list {👩‍💻} {!}]] [list rtl {שלום} [list {ש} {ל} {ו} {ם}]] [list cjk {日本語} [list {日} {本} {語}]]]",
          "}",
          "proc ::imeSample::setCheckOutput {lines} {",
          "    set text [join $lines \\n]",
          "    if {[winfo exists .root.checks.output]} {",
          "        .root.checks.output configure -state normal",
          "        .root.checks.output delete 1.0 end",
          "        .root.checks.output insert end $text",
          "        .root.checks.output configure -state disabled",
          "    }",
          "    browser::setResult $text",
          "}",
          "proc ::imeSample::complexTextReport {} {",
          "    set font [::imeSample::complexFont]",
          "    set lines [list {complex text metrics}]",
          "    foreach case [::imeSample::complexCases] {",
          "        lassign $case name text segments",
          "        set full [font measure $font $text]",
          "        set sum 0",
          "        foreach segment $segments {incr sum [font measure $font $segment]}",
          "        lappend lines [list $name text $text full $full segmentSum $sum ok [expr {abs($full - $sum) <= 1}]]",
          "    }",
          "    ::imeSample::setCheckOutput $lines",
          "    return $lines",
          "}",
          "proc ::imeSample::drawComplexCanvas {} {",
          "    if {![winfo exists .root.checks.canvas]} {return {}}",
          "    set font [::imeSample::complexFont]",
          "    .root.checks.canvas delete all",
          "    set y 24",
          "    foreach case [::imeSample::complexCases] {",
          "        lassign $case name text segments",
          "        .root.checks.canvas create text 10 $y -anchor w -text [format {%s: %s} $name $text] -font $font -fill black",
          "        incr y 28",
          "    }",
          "    return drawn",
          "}",
          "proc ::imeSample::caretReport {} {",
          "    set entry .root.checks.caretEntry",
          "    set font [::imeSample::complexFont]",
          "    set lines [list {entry caret advance}]",
          "    if {![winfo exists $entry]} {",
          "        lappend lines {caret entry missing}",
          "        ::imeSample::setCheckOutput $lines",
          "        return $lines",
          "    }",
          "    foreach case [concat [list [list digits {123456789012345678901234567890123456}]] [::imeSample::complexCases]] {",
          "        lassign $case name text segments",
          "        $entry configure -font $font",
          "        $entry delete 0 end",
          "        $entry insert 0 $text",
          "        focus -force $entry",
          "        update",
          "        $entry icursor 0",
          "        set startBox [$entry bbox insert]",
          "        $entry icursor end",
          "        set endBox [$entry bbox end]",
          "        set x0 [lindex $startBox 0]",
          "        set x1 [expr {[lindex $endBox 0] + [lindex $endBox 2]}]",
          "        set advance [expr {$x1 - $x0}]",
          "        set expected [font measure $font $text]",
          "        lappend lines [list $name advance $advance expected $expected ok [expr {abs($advance - $expected) <= 1}]]",
          "    }",
          "    $entry delete 0 end",
          "    $entry insert 0 {123456789012345678901234567890123456}",
          "    $entry icursor end",
          "    ::imeSample::setCheckOutput $lines",
          "    return $lines",
          "}",
          "proc ::imeSample::displayModelReport {} {",
          "    set probes [list [list screen {winfo screen .}] [list screenwidth {winfo screenwidth .}] [list screenheight {winfo screenheight .}] [list screendepth {winfo screendepth .}] [list screenvisual {winfo screenvisual .}] [list visual {winfo visual .}] [list depth {winfo depth .}] [list visualid {winfo visualid .}] [list visualsavailable {winfo visualsavailable . includeids}] [list cells {winfo cells .}] [list colormapfull {winfo colormapfull .}]]",
          "    set lines [list {X11 display model}]",
          "    foreach probe $probes {",
          "        lassign $probe name command",
          "        set code [catch {uplevel #0 $command} value]",
          "        lappend lines [list $name code $code value $value]",
          "    }",
          "    ::imeSample::setCheckOutput $lines",
          "    return $lines",
          "}",
          "proc ::imeSample::fullscreenReport {action} {",
          "    set before [wm attributes . -fullscreen]",
          "    if {$action eq {exit}} {",
          "        set target 0",
          "    } elseif {$action eq {enter}} {",
          "        set target 1",
          "    } else {",
          "        set target [expr {!$before}]",
          "    }",
          "    set code [catch {wm attributes . -fullscreen $target; update} message]",
          "    set after [wm attributes . -fullscreen]",
          "    set lines [list [list fullscreen action $action before $before target $target after $after code $code message $message]]",
          "    ::imeSample::setCheckOutput $lines",
          "    return $lines",
          "}",
          "proc ::imeSample::dialogReport {kind} {",
          "    switch -- $kind {",
          "        open {set code [catch {tk_getOpenFile -title {Open sample text} -filetypes {{Text {.txt}} {All {*}}}} result]}",
          "        save {set code [catch {set path [tk_getSaveFile -title {Save sample text} -initialfile tcltk-wasm-dialog.txt -defaultextension .txt]; if {$path ne {}} {set fh [open $path w]; puts -nonewline $fh {Tcl/Tk WASM native save dialog sample}; close $fh; ::browser::flushSaveFile $path tcltk-wasm-dialog.txt}; set path} result]}",
          "        directory {set code [catch {tk_chooseDirectory -title {Choose sample directory}} result]}",
          "        color {set code [catch {tk_chooseColor -title {Choose sample color} -initialcolor #3366ff} result]}",
          "        message {set code [catch {tk_messageBox -type okcancel -icon info -title {Native dialog} -message {Dialog bridge check} -detail {The app sample is checking Tk native dialog routing.}} result]}",
          "        default {set code 1; set result [format {unknown dialog kind: %s} $kind]}",
          "    }",
          "    set status [expr {$code == 0 ? {ok} : {error}}]",
          "    set canceled [expr {$code == 0 && $result eq {}}]",
          "    set lines [list [list dialog $kind status $status canceled $canceled result $result]]",
          "    ::imeSample::setCheckOutput $lines",
          "    return $lines",
          "}",
          "proc ::imeSample::runCompatibilityChecks {} {",
          "    set lines [list {compatibility checks}]",
          "    foreach procName {complexTextReport caretReport displayModelReport} {",
          "        set code [catch {::imeSample::$procName} value]",
          "        lappend lines [list $procName code $code]",
          "        if {$code == 0} {",
          "            foreach line $value {lappend lines $line}",
          "        } else {",
          "            lappend lines [list $procName error $value]",
          "        }",
          "    }",
          "    ::imeSample::drawComplexCanvas",
          "    ::imeSample::setCheckOutput $lines",
          "    return $lines",
          "}",
          "frame .root -background white -padx 16 -pady 16",
          "label .root.title -text {Tcl/Tk WASM IME Sample} -font {Helvetica 18 bold} -background white",
          "label .root.body -text {Focus each field and test composition, conversion, cursor movement, and commit behavior.} -background white -anchor w -justify left",
          "frame .root.form -background white",
          "label .root.form.entryLabel -text {Entry} -background white -anchor e",
          "entry .root.form.entry -width 42",
          "label .root.form.initialLabel -text {Entry with text} -background white -anchor e",
          "entry .root.form.initial -width 42",
          ".root.form.initial insert end {日本語の初期値 abc 123}",
          "label .root.form.textLabel -text {Text} -background white -anchor ne",
          "text .root.form.text -width 42 -height 5 -wrap char",
          ".root.form.text insert 1.0 {ここで日本語 IME の変換、確定、改行、カーソル移動を試してください。}",
          "label .root.form.spinLabel -text {Spinbox} -background white -anchor e",
          "spinbox .root.form.spin -values {かな カナ 漢字 alphabet 12345} -width 40",
          "label .root.form.passwordLabel -text {Password entry} -background white -anchor e",
          "entry .root.form.password -show * -width 42",
          "grid .root.form.entryLabel -row 0 -column 0 -sticky e -padx {0 8} -pady 4",
          "grid .root.form.entry -row 0 -column 1 -sticky ew -pady 4",
          "grid .root.form.initialLabel -row 1 -column 0 -sticky e -padx {0 8} -pady 4",
          "grid .root.form.initial -row 1 -column 1 -sticky ew -pady 4",
          "grid .root.form.textLabel -row 2 -column 0 -sticky ne -padx {0 8} -pady 4",
          "grid .root.form.text -row 2 -column 1 -sticky nsew -pady 4",
          "grid .root.form.spinLabel -row 3 -column 0 -sticky e -padx {0 8} -pady 4",
          "grid .root.form.spin -row 3 -column 1 -sticky ew -pady 4",
          "grid .root.form.passwordLabel -row 4 -column 0 -sticky e -padx {0 8} -pady 4",
          "grid .root.form.password -row 4 -column 1 -sticky ew -pady 4",
          "grid columnconfigure .root.form 1 -weight 1",
          "grid rowconfigure .root.form 2 -weight 1",
          "frame .root.buttons -background white",
          "button .root.buttons.report -text {Report values} -command {::imeSample::report}",
          "button .root.buttons.clear -text {Clear fields} -command {::imeSample::clear}",
          "button .root.buttons.result -text {Set result} -command {browser::setResult {button clicked}}",
          "pack .root.buttons.report .root.buttons.clear .root.buttons.result -side left -padx {0 8}",
          "frame .root.status -background white",
          "label .root.status.label -text {Last input event:} -background white -anchor w",
          "label .root.status.value -text {none} -background white -anchor w -justify left -wraplength 520",
          "pack .root.status.label -side top -anchor w",
          "pack .root.status.value -side top -fill x -anchor w",
          "frame .root.checks -background white -borderwidth 1 -relief solid -padx 10 -pady 10",
          "label .root.checks.title -text {Compatibility checks} -font {Helvetica 13 bold} -background white -anchor w",
          "label .root.checks.caretLabel -text {Caret entry} -background white -anchor w",
          "entry .root.checks.caretEntry -width 42 -font [::imeSample::complexFont] -foreground black -background white -insertbackground red -insertwidth 3 -insertofftime 0 -insertontime 60000",
          ".root.checks.caretEntry insert end {123456789012345678901234567890123456}",
          "canvas .root.checks.canvas -width 520 -height 150 -background white -highlightthickness 1 -highlightbackground #c8c8c8",
          "frame .root.checks.buttons -background white",
          "foreach {name text command} {",
          "    run {Run checks} {::imeSample::runCompatibilityChecks}",
          "    metrics {Text metrics} {::imeSample::complexTextReport}",
          "    caret {Caret advance} {::imeSample::caretReport}",
          "    draw {Draw text} {::imeSample::drawComplexCanvas}",
          "    display {Display model} {::imeSample::displayModelReport}",
          "    fullscreen {Fullscreen} {::imeSample::fullscreenReport toggle}",
          "    exitfull {Exit fullscreen} {::imeSample::fullscreenReport exit}",
          "    open {Open file} {::imeSample::dialogReport open}",
          "    save {Save file} {::imeSample::dialogReport save}",
          "    directory {Directory} {::imeSample::dialogReport directory}",
          "    color {Color} {::imeSample::dialogReport color}",
          "    message {Message} {::imeSample::dialogReport message}",
          "} {",
          "    button .root.checks.buttons.$name -text $text -command $command",
          "}",
          "set buttonIndex 0",
          "foreach name {run metrics caret draw display fullscreen exitfull open save directory color message} {",
          "    set row [expr {$buttonIndex / 4}]",
          "    set column [expr {$buttonIndex % 4}]",
          "    grid .root.checks.buttons.$name -row $row -column $column -sticky ew -padx {0 6} -pady 3",
          "    incr buttonIndex",
          "}",
          "foreach column {0 1 2 3} {grid columnconfigure .root.checks.buttons $column -weight 1 -uniform checkButtons}",
          "text .root.checks.output -width 72 -height 8 -wrap word -background #f7f7f7 -state disabled",
          "grid .root.checks.title -row 0 -column 0 -sticky ew -pady {0 6}",
          "grid .root.checks.caretLabel -row 1 -column 0 -sticky ew",
          "grid .root.checks.caretEntry -row 2 -column 0 -sticky ew -pady {2 8}",
          "grid .root.checks.canvas -row 3 -column 0 -sticky ew -pady {0 8}",
          "grid .root.checks.buttons -row 4 -column 0 -sticky ew -pady {0 8}",
          "grid .root.checks.output -row 5 -column 0 -sticky nsew",
          "grid columnconfigure .root.checks 0 -weight 1",
          "grid rowconfigure .root.checks 5 -weight 1",
          "::imeSample::drawComplexCanvas",
          "foreach widget {.root.form.entry .root.form.initial .root.form.text .root.form.spin .root.form.password .root.checks.caretEntry} {",
          "    bind $widget <FocusIn> {::imeSample::record focus %W {}}",
          "    bind $widget <KeyRelease> {::imeSample::record key %W {%A}}",
          "}",
          "bind all <<X11WasmCompositionStart>> {::imeSample::record composition-start %W {%d}}",
          "bind all <<X11WasmCompositionUpdate>> {::imeSample::record composition-update %W {%d}}",
          "bind all <<X11WasmCompositionEnd>> {::imeSample::record composition-end %W {%d}}",
          "::imeSample::installShortcutObservers",
          "pack .root.title -side top -anchor w -pady {0 4}",
          "pack .root.body -side top -fill x -anchor w -pady {0 10}",
          "pack .root.form -side top -fill both -expand 1",
          "pack .root.buttons -side top -fill x -pady {10 6}",
          "pack .root.status -side top -fill x -pady {6 0}",
          "pack .root.checks -side top -fill both -expand 1 -pady {10 0}",
          "pack .root -fill both -expand 1",
          "focus -force .root.form.entry",
          "update",
          "list ready [winfo children .]"
        ].join("\n");
      }

      function demoScript() {
        return [
          "catch {destroy .demo}",
          "toplevel .demo",
          "wm title .demo {Demo Window}",
          "label .demo.label -text {Hello from Tcl shell} -padx 16 -pady 10",
          "button .demo.close -text Close -command {destroy .demo}",
          "pack .demo.label .demo.close -side top -fill x",
          "update",
          "list demo [winfo children .]"
        ].join("\n");
      }

      function locationArgs() {
        const params = new URLSearchParams(window.location.search);
        return [...params.getAll("argv"), ...params.getAll("arg")];
      }

      function locationEvalScripts() {
        const params = new URLSearchParams(window.location.search);
        return params.getAll("eval");
      }

      function writeCString(text) {
        const module = globalThis.Module || {};
        const malloc = module._malloc;
        const heap = globalThis.HEAPU8 || module.HEAPU8;
        const bytes = encoder.encode(text);
        const pointer = typeof malloc === "function"
          ? malloc(bytes.length + 1)
          : 0;

        if (!pointer || !heap) {
          throw new Error("wasm memory is not ready");
        }
        heap.set(bytes, pointer);
        heap[pointer + bytes.length] = 0;
        return pointer;
      }

      async function evalTcl(script, echo) {
        const module = globalThis.Module || {};
        const evalFn = module._TkBrowserEval;
        const free = module._free;
        let pointer = 0;
        let code = 1;

        if (!runtimeReady || typeof evalFn !== "function") {
          appendOutput("! ", "Tcl runtime is not ready");
          return code;
        }
        if (evaluationPending) {
          appendOutput("! ", "Tcl evaluation is already in progress");
          return code;
        }
        evaluationPending = true;
        setShellEnabled(runtimeReady);
        if (echo) {
          appendOutput("% ", script);
        }
        try {
          // Other native calls may own Asyncify's single completion waiter.
          while (globalThis.Asyncify?.currData) {
            await new Promise((resolve) => setTimeout(resolve, 0));
          }
          pointer = writeCString(script);
          const value = evalFn(pointer);
          if (value && typeof value.then === "function") {
            code = await value;
          } else if (globalThis.Asyncify?.currData) {
            code = await globalThis.Asyncify.whenDone();
          } else {
            code = value;
          }
        } catch (error) {
          appendOutput("! ", error instanceof Error ? error.message : String(error));
          return 1;
        } finally {
          if (pointer && typeof free === "function") {
            free(pointer);
          }
          evaluationPending = false;
          setShellEnabled(runtimeReady);
        }
        appendOutput(code === 0 ? "= " : "! ",
          module.tkBrowserEvalResult || (resultElement ? resultElement.textContent : ""));
        return code;
      }

      async function runCommand() {
        if (!(commandElement instanceof HTMLTextAreaElement)) {
          return;
        }
        const script = commandElement.value.trim();
        if (!script) {
          return;
        }
        history.push(script);
        historyIndex = history.length;
        await evalTcl(script, true);
      }

      function setCommandFromHistory(delta) {
        if (!(commandElement instanceof HTMLTextAreaElement) || history.length === 0) {
          return;
        }
        historyIndex = Math.max(0, Math.min(history.length, historyIndex + delta));
        commandElement.value = history[historyIndex] || "";
      }

      if (runButton) {
        runButton.addEventListener("click", runCommand);
      }
      if (demoButton) {
        demoButton.addEventListener("click", async () => {
          await evalTcl(demoScript(), true);
        });
      }
      if (clearButton && outputElement) {
        clearButton.addEventListener("click", () => {
          outputElement.textContent = "";
        });
      }
      if (commandElement instanceof HTMLTextAreaElement) {
        commandElement.addEventListener("keydown", (event) => {
          if ((event.metaKey || event.ctrlKey) && event.key === "Enter") {
            event.preventDefault();
            runCommand();
          } else if (event.altKey && event.key === "ArrowUp") {
            event.preventDefault();
            setCommandFromHistory(-1);
          } else if (event.altKey && event.key === "ArrowDown") {
            event.preventDefault();
            setCommandFromHistory(1);
          }
        });
      }

      const module = globalThis.Module || {};
      const evalScripts = locationEvalScripts();
      const existingPostRun = module.postRun;
      const postRun = Array.isArray(existingPostRun)
        ? [...existingPostRun]
        : existingPostRun
          ? [existingPostRun]
          : [];

      module.x11WasmRoot = "#tk-browser-root";
      module.x11WasmServiceUserActivationEvents = function serviceUserActivationEvents() {
        const service = module._TkBrowserServiceUserActivationEvents;
        return typeof service === "function" ? service() : 0;
      };
      module.locateFile = function locateFile(path) {
        const name = String(path).split("/").pop();
        return new URL(name, document.baseURI).href;
      };
      module.arguments = locationArgs();
      module.tkBrowserEvalScripts = evalScripts.length > 0
        ? evalScripts
        : [initialTkScript()];
      module.setStatus = setStatus;
      module.print = function print(text) {
        appendOutput("> ", text);
      };
      module.printErr = function printErr(text) {
        appendOutput("! ", text);
      };
      postRun.push(() => {
        setShellEnabled(true);
        appendOutput("> ", "ready");
        if (commandElement instanceof HTMLTextAreaElement) {
          commandElement.focus();
        }
      });
      module.postRun = postRun;
      globalThis.Module = module;

      window.addEventListener("error", (event) => {
        setStatus("failed");
        appendOutput("! ", event.message || "browser error");
      });
      window.addEventListener("unhandledrejection", (event) => {
        setStatus("failed");
        appendOutput("! ", event.reason instanceof Error
          ? event.reason.message
          : String(event.reason));
      });
      globalThis.tclTkBrowserEval = function tclTkBrowserEval(script) {
        return evalTcl(String(script || ""), false);
      };
    })();
  </script>
  <script async src="tcltk.js"></script>
</body>
</html>
